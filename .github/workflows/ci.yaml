name: CI

on:
  push:
    branches: [main]
  pull_request:          # на каждый PR, в любую ветку

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # склонировать репозиторий в раннер
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true               # кэшировать скачанные пакеты между запусками
          python-version: "3.13"
      - run: uv sync --frozen              # --frozen: строго по uv.lock, см. теорию ниже
      - run: uv run ruff check .
      - run: uv run ruff format --check .  # --check: только проверить, ничего не менять

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -v
        env:
          ENVIRONMENT: ci
          LOG_LEVEL: INFO
          SECRET_KEY: ci-secret-not-a-real-one
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST: localhost
          POSTGRES_DB: ci
          REDIS_URL: redis://localhost:6379/0

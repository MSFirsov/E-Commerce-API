[project]
name = "e-commerce-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle + pyflakes: база, синтаксис и неиспользуемые имена
    "I",        # isort: порядок и группировка импортов
    "UP",       # pyupgrade: не писать по-старому то, что в 3.13 пишется короче
    "B",        # bugbear: типичные логические ловушки (мутабельный аргумент по умолчанию и т.п.)
    "S",        # bandit: проблемы безопасности (хардкод паролей, assert в проде, слабые хэши)
    "ASYNC",    # ловушки асинхронного кода
    "RUF",      # собственные правила ruff
]

[tool.ruff.lint.per-file-ignores]
# S101 - «использован assert».
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/app", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false   # в тестах не требовать аннотаций у каждой функции

[tool.pytest.ini_options]
asyncio_mode = "auto"           # не помечать каждый async-тест декоратором вручную
testpaths = ["tests"]
